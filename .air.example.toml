# Example Air configuration file
# This is a reference configuration for Air hot-reloading
# Copy this file to .air.toml and customize as needed

# Working directory and temporary build directory
root = "."
tmp_dir = "tmp"

[build]
# The command to run when a file changes
cmd = "go build -o ./tmp/main ./cmd/server"

# Binary file path
bin = "tmp/main"

# Customize binary execution
# full_bin = "APP_ENV=dev APP_USER=air ./tmp/main"

# File extensions to watch for changes
include_ext = ["go", "tpl", "tmpl", "yaml", "toml"]

# Directories to exclude from watching
exclude_dir = ["tmp", "vendor", ".git", "node_modules"]

# Files to exclude from watching
# exclude_file = ["Dockerfile", ".gitignore"]

# Exclude specific regexp patterns
exclude_regex = ["_test\\.go"]

# Don't trigger builds for unchanged files
exclude_unchanged = true

# Delay between each build (ms)
delay = 1000

# Stop running old binary when build errors occur
stop_on_error = true

# Send interrupt signal before killing process
send_interrupt = true

# Delay before sending kill signal (ms)
kill_delay = 500

[log]
# Show log time
time = true

# Only show main log
main_only = false

[color]
# Customize colors for different outputs
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true