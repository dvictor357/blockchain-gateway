version: "3.8"

services:
  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: blockchain-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - blockchain-network
    restart: unless-stopped

  # Development service with hot-reloading
  blockchain-gateway-dev:
    build:
      context: .
      target: development
    container_name: blockchain-gateway-dev
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - GIN_MODE=debug
      - PORT=8080
      - ETH_RPC_URL=https://ethereum.publicnode.com
      - BTC_RPC_URL=https://btc.getblock.io/mainnet
      - LOG_LEVEL=debug
      - REQUEST_TIMEOUT=30
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
    networks:
      - blockchain-network
    restart: unless-stopped

  # Production service
  blockchain-gateway-prod:
    build:
      context: .
      target: production
    container_name: blockchain-gateway-prod
    ports:
      - "8081:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - ETH_RPC_URL=https://ethereum.publicnode.com
      - BTC_RPC_URL=https://btc.getblock.io/mainnet
      - LOG_LEVEL=info
      - REQUEST_TIMEOUT=30
    networks:
      - blockchain-network
    restart: unless-stopped
    # Uncomment for production deployment
    # deploy:
    #   replicas: 2
    #   update_config:
    #     parallelism: 1
    #     delay: 10s
    #   restart_policy:
    #     condition: on-failure

networks:
  blockchain-network:
    driver: bridge

volumes:
  go-modules:
    driver: local
  redis_data:
    driver: local
